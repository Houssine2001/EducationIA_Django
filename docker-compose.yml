services:
  web:
    build:
      context: .
    image: educationia_web:latest
    # entrypoint is configured in the image; working_dir set to evaluation_project
    working_dir: /code/evaluation_project
    volumes:
      - ./:/code
      # Override db.sqlite3 with empty volume to prevent host file from being used
      - /code/evaluation_project/db.sqlite3
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override these in your .env file for production
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DB_NAME=django_education
      - DJANGO_SECRET_KEY=changeme
      - DEBUG=0
      - USE_MONGO=1  # CHANGÉ: Activer MongoDB
    depends_on:
      - mongo

  mongo:
    image: mongo:6.0
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
